<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow,max-image-preview:large">
<meta name="description" id="metaDesc" content="Read manga chapters on MangaReader.">
<link rel="canonical" id="canonical" href="https://kindgommangaraw.github.io/manga.html">
<meta property="og:type" content="website">
<meta property="og:title" id="ogTitle" content="MangaReader Manga">
<meta property="og:description" id="ogDesc" content="Read manga chapters on MangaReader.">
<meta property="og:url" id="ogUrl" content="https://kindgommangaraw.github.io/manga.html">
<meta property="og:image" id="ogImage" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" id="twTitle" content="MangaReader Manga">
<meta name="twitter:description" id="twDesc" content="Read manga chapters on MangaReader.">
<meta name="twitter:image" id="twImage" content="">
<title id="pageTitle">MangaReader Manga</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f5f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.top{border-bottom:1px solid #242733}.bar{max-width:1100px;margin:auto;padding:15px 18px;display:flex;justify-content:space-between}.brand,.back{color:inherit;text-decoration:none;font-weight:700}.wrap{max-width:1000px;margin:auto;padding:30px 16px 60px}.hero{display:grid;grid-template-columns:minmax(180px,280px) 1fr;gap:28px;align-items:start}.cover{width:100%;max-height:420px;object-fit:cover;border-radius:14px;background:#11141b;border:1px solid #292e3a}.no-cover{min-height:260px;display:grid;place-items:center;border:1px dashed #303543;border-radius:14px;color:#8f96a5}.info h1{font-size:clamp(28px,5vw,46px);line-height:1.2;margin:0 0 10px}.muted{color:#9aa0ad}.meta{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tag{padding:6px 10px;border-radius:999px;background:#151a24;border:1px solid #2a3040;color:#bfc8d9;font-size:13px}.desc{line-height:1.7;color:#c0c5d0}.chapters{margin-top:35px}.chapters h2{font-size:24px}.list{display:grid;gap:10px}.chapter{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 16px;background:#11141b;border:1px solid #252a36;border-radius:12px;text-decoration:none;color:inherit}.chapter:hover{border-color:#46506a}.num{color:#aebee0}.state{text-align:center;padding:55px 20px;border:1px dashed #303543;border-radius:14px;color:#a4a9b6}.error{color:#ff9d9d}@media(max-width:700px){.hero{grid-template-columns:1fr}.cover,.no-cover{max-width:280px;margin:auto}}
</style>
</head>
<body>
<header class="top"><div class="bar"><a class="brand" href="/">MangaReader</a><a class="back" href="/">← Home</a></div></header>
<main class="wrap"><section id="app"><div class="state">Loading manga…</div></section></main>
<script>
const slug=new URLSearchParams(location.search).get('slug');
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function json(path){const r=await fetch(path+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Could not load '+path);return r.json();}
function setSEO(title,desc,url,image){document.title=title;document.getElementById('metaDesc').content=desc;document.getElementById('canonical').href=url;document.getElementById('ogTitle').content=title;document.getElementById('ogDesc').content=desc;document.getElementById('ogUrl').content=url;document.getElementById('twTitle').content=title;document.getElementById('twDesc').content=desc;if(image){document.getElementById('ogImage').content=image;document.getElementById('twImage').content=image;}}
async function load(){
 if(!slug){app.innerHTML='<div class="state error">Manga not found.</div>';return;}
 try{
  const [mangaData,chapterData]=await Promise.all([json('/data/manga.json'),json('/data/chapters.json')]);
  const manga=(mangaData.manga||[]).find(x=>x.slug===slug);
  if(!manga){app.innerHTML='<div class="state error">Manga not found.</div>';return;}
  const chapters=(chapterData.chapters||[]).filter(x=>x.manga_slug===slug).slice().sort((a,b)=>Number(b.number)-Number(a.number));
  const title=manga.title||slug;
  const desc=manga.description||`${title} manga chapters on MangaReader.`;
  const url=location.origin+location.pathname+'?slug='+encodeURIComponent(slug);
  const image=manga.cover||'';
  setSEO(title,desc,url,image);
  const cover=image?`<img class="cover" src="${esc(image)}" alt="${esc(title)} cover" loading="eager" decoding="async">`:'<div class="no-cover">Cover image not available</div>';
  const tags=[manga.country,manga.status,manga.author,manga.artist].filter(Boolean).map(x=>`<span class="tag">${esc(x)}</span>`).join('');
  const list=chapters.length?chapters.map(c=>`<a class="chapter" href="/chapter.html?slug=${encodeURIComponent(c.slug||'')}"><span><strong>${esc(c.title||('Chapter '+c.number))}</strong></span><span class="num">Chapter ${esc(c.number||'')}</span></a>`).join(''):'<div class="state">No chapters published yet.</div>';
  app.innerHTML=`<section class="hero"><div>${cover}</div><div class="info"><h1>${esc(title)}</h1>${tags?`<div class="meta">${tags}</div>`:''}<p class="desc">${esc(desc)}</p></div></section><section class="chapters"><h2>Chapters</h2><div class="list">${list}</div></section>`;
 }catch(e){console.error(e);app.innerHTML='<div class="state error">Could not load this manga. Please try again.</div>';}
}
load();
</script>
</body>
</html>
