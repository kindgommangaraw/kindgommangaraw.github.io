<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="MangaReader — read manga chapters online."><link rel="canonical" href="https://kindgommangaraw.github.io/"><title>MangaReader</title><style>body{margin:0;background:#08090d;color:#f5f5f7;font-family:system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{padding:18px 5%;border-bottom:1px solid #222}.wrap{max-width:1100px;margin:auto;padding:40px 5%}.hero{padding:30px 0}.hero h1{font-size:clamp(36px,6vw,64px);margin:0 0 12px}.muted{color:#9aa0ad}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px}.card{background:#11131a;border:1px solid #252936;border-radius:14px;overflow:hidden;padding-bottom:14px}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;background:#171922}.card h2,.card p{padding:0 12px}.card h2{font-size:17px;margin:10px 0 5px}.card p{font-size:13px;color:#9aa0ad}.empty{padding:30px;border:1px dashed #303340;border-radius:12px;color:#9296a5}</style></head><body><nav class="nav"><strong>MangaReader</strong> · <a href="/blog.html">Blog</a> · <a href="/country.html?country=JP">Japan</a> · <a href="/country.html?country=FR">France</a></nav><main class="wrap"><section class="hero"><h1>Latest Manga</h1><p class="muted">Browse the latest manga and chapters published on MangaReader.</p></section><section id="grid" class="grid"><div class="empty">Loading…</div></section></main><script>const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));fetch("/data/manga.json").then(r=>r.json()).then(x=>{const d=x.manga||[];grid.innerHTML=d.length?d.map(m=>`<a class="card" href="/manga.html?slug=${encodeURIComponent(m.slug)}"><img src="${esc(m.cover||m.cover_url||"")}" alt="${esc(m.title)} cover" loading="lazy"><h2>${esc(m.title)}</h2><p>${esc(m.author||"")} · ${esc(m.status||"")}</p></a>`).join(""):"<div class=empty>No manga published yet.</div>"}).catch(()=>grid.innerHTML="<div class=empty>Could not load manga data.</div>")</script></body></html>
