<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="MangaReader — latest manga chapters."><link rel="canonical" href="https://kindgommangaraw.github.io/"><title>MangaReader</title><style>body{margin:0;background:#08090d;color:#f5f5f7;font-family:system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{padding:18px 5%;border-bottom:1px solid #222}.wrap{max-width:1100px;margin:auto;padding:40px 5%}.hero{padding:30px 0}.hero h1{font-size:clamp(36px,6vw,64px);margin:0 0 12px}.muted{color:#9aa0ad}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}.card{display:block;background:#11131a;border:1px solid #252936;border-radius:14px;overflow:hidden;padding:20px;transition:.2s}.card:hover{border-color:#4b556d;transform:translateY(-2px)}.badge{display:inline-block;font-size:12px;padding:5px 9px;border-radius:999px;background:#1b2230;color:#aebee0;margin-bottom:12px}.card h2{font-size:18px;line-height:1.45;margin:0 0 8px}.card p{font-size:13px;color:#9aa0ad;margin:0}.empty{padding:30px;border:1px dashed #303340;border-radius:12px;color:#9296a5}</style></head><body><nav class="nav"><strong>MangaReader</strong> · <a href="/blog.html">Blog</a> · <a href="/country.html?country=JP">Japan</a> · <a href="/country.html?country=FR">France</a></nav><main class="wrap"><section class="hero"><h1>Latest Manga Chapters</h1><p class="muted">Browse the latest chapters published on MangaReader.</p></section><section id="chapters" class="grid"><div class="empty">Loading…</div></section></main><script>const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));fetch('/data/chapters.json?'+Date.now()).then(r=>r.json()).then(x=>{const d=(x.chapters||[]).slice().reverse();chapters.innerHTML=d.length?d.map(c=>`<a class="card" href="/manga.html?slug=${encodeURIComponent(c.manga_slug||'')}"><span class="badge">Chapter ${esc(c.number||'')}</span><h2>${esc(c.title||('Chapter '+(c.number||'')))}</h2><p>${esc(c.manga_slug||'')}</p></a>`).join(''):'<div class="empty">No chapters published yet.</div>'}).catch(()=>chapters.innerHTML='<div class="empty">Could not load chapters.</div>');</script></body></html>
