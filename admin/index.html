<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaReader Admin</title><link rel="stylesheet" href="admin.css"></head><body><main><h1>MangaReader Admin</h1><p>GitHub-only control panel. The credential is kept only in this browser.</p><label>GitHub token<input id="token" type="password" autocomplete="off"></label><button id="save">Save locally</button><button id="clear">Clear</button><hr><h2>Manga</h2><input id="slug" placeholder="slug"><input id="title" placeholder="title"><input id="country" placeholder="country (JP/FR/US...)"><input id="author" placeholder="author"><input id="cover" placeholder="cover path"><textarea id="description" placeholder="description"></textarea><button id="manga">Save manga</button><h2>Chapter</h2><input id="cslug" placeholder="chapter slug"><input id="mangaSlug" placeholder="manga slug"><input id="number" placeholder="chapter number"><input id="chapterTitle" placeholder="chapter title"><textarea id="pages" placeholder='Pages JSON: ["/chapter-images/slug/001.webp"]'></textarea><button id="chapter">Save chapter</button><pre id="status"></pre></main><script src="admin.js"></script></body></html>
