<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaReader Admin</title><link rel="stylesheet" href="admin.css"><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f5f7;font-family:Inter,system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px 16px 50px}.panel{background:#101118;border:1px solid #272b36;border-radius:14px;padding:20px;margin:14px 0}.hero{border-color:#334d77}.muted{color:#9299a8;font-size:13px;line-height:1.6}label{display:block;font-size:13px;color:#aeb3c0;margin:12px 0 6px}input,textarea,select{width:100%;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;font:inherit;outline:none;margin-bottom:8px}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:#fff;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.5;cursor:not-allowed}.token-row,.grid{display:grid;grid-template-columns:1fr auto;gap:10px}.grid{grid-template-columns:1fr 1fr}.state{font-size:13px;font-weight:700}.bad{color:#f0aeb8}.good{color:#8ee6ad}.status{padding:10px;border-radius:8px;background:#171b23;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.danger{background:#8f3f4d}.save-token{display:flex;align-items:center;gap:8px}.save-token input{width:auto}@media(max-width:700px){.token-row,.grid{grid-template-columns:1fr}}</style></head><body><main><div class="panel hero"><h1>⚙️ MangaReader Admin</h1><p class="muted">GitHub-powered control panel.</p><div class="token-row"><div><label>GitHub Token</label><input id="token" type="password" autocomplete="off"></div><button id="connect" type="button">🔗 Connect GitHub</button></div><label class="save-token"><input id="saveToken" type="checkbox"> Save token in this browser</label><div id="loginStatus" class="state bad">● Not connected</div><button id="clear" type="button">Clear saved token</button><div id="status" class="status">Enter your GitHub token and press Connect GitHub.</div></div><section id="panel"><div class="panel"><h2>📚 Manga</h2><div class="grid"><div><label>Slug</label><input id="slug"></div><div><label>Title</label><input id="title"></div></div><div class="grid"><div><label>Country</label><input id="country"></div><div><label>Author</label><input id="author"></div></div><label>Cover path</label><input id="cover"><label>Description</label><textarea id="description"></textarea><button id="manga" type="button">💾 Save manga</button></div><div class="panel"><h2>📖 Chapter Manager</h2><label>Existing chapter</label><select id="chapterSelect"><option value="">Select chapter to edit</option></select><button id="refreshChapters" type="button">Refresh chapters</button><div class="grid"><div><label>Chapter slug</label><input id="cslug"></div><div><label>Manga slug</label><input id="mangaSlug"></div></div><div class="grid"><div><label>Chapter number</label><input id="number"></div><div><label>Chapter title</label><input id="chapterTitle"></div></div><label>Chapter images</label><input id="imageFiles" type="file" accept="image/*" multiple><button id="uploadImages" type="button">⬆️ Upload selected images</button><label>Uploaded page paths</label><textarea id="pages"></textarea><div><button id="chapter" type="button">💾 Save / Update chapter</button><button id="deleteChapter" class="danger" type="button">🗑 Delete chapter</button></div></div></section></main><script>
const KEY="mr_admin_token",token=document.getElementById("token"),connect=document.getElementById("connect"),status=document.getElementById("status"),loginStatus=document.getElementById("loginStatus"),saveToken=document.getElementById("saveToken");let chapters=[];
const state=(ok,t)=>{loginStatus.className="state "+(ok?"good":"bad");loginStatus.textContent="● "+t};
const auth=()=>sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||token.value.trim()||(()=>{throw Error("GitHub is not connected.")})();
async function api(path,opt={}){const r=await fetch("https://api.github.com/repos/kindgommangaraw/kindgommangaraw.github.io/contents/"+path,{...opt,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+auth(),"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json",...(opt.headers||{})},cache:"no-store"});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error("GitHub HTTP "+r.status+": "+(d.message||"Request failed"));return d}
async function sha(path){try{return(await api(path)).sha}catch(e){if(e.message.includes("404"))return null;throw e}}
async function b64(f){const u=new Uint8Array(await f.arrayBuffer());let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)}
async function upload(){const b=document.getElementById("uploadImages");try{const m=document.getElementById("mangaSlug").value.trim(),n=document.getElementById("number").value.trim(),files=[...document.getElementById("imageFiles").files];if(!m||!n)throw Error("Select/load a chapter first.");if(!files.length)throw Error("Select an image first.");b.disabled=true;b.textContent="⏳ Uploading...";const dir="chapter-images/"+m+"/chapter-"+n+"/",pages=[];files.sort((a,z)=>a.name.localeCompare(z.name,undefined,{numeric:true}));for(let i=0;i<files.length;i++){const f=files[i],ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",name=String(i+1).padStart(3,"0")+"."+ext,path=dir+name;status.textContent="Uploading "+name+" ("+(i+1)+"/"+files.length+")...";const body={message:"Admin: upload chapter image",content:await b64(f),branch:"main"},s=await sha(path);if(s)body.sha=s;await api(path,{method:"PUT",body:JSON.stringify(body)});pages.push("/"+path+"?v="+Date.now());status.textContent="✓ Uploaded "+name}document.getElementById("pages").value=JSON.stringify(pages,null,2);status.textContent="✓ Upload complete. Now click Save / Update chapter."}catch(e){status.textContent="❌ UPLOAD ERROR: "+e.message;console.error(e)}finally{b.disabled=false;b.textContent="⬆️ Upload selected images"}}
document.getElementById("uploadImages").onclick=upload;
async function verify(t){try{connect.disabled=true;status.textContent="Checking GitHub...";const r=await fetch("https://api.github.com/repos/kindgommangaraw/kindgommangaraw.github.io",{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},cache:"no-store"});if(!r.ok)throw Error((await r.json()).message||("HTTP "+r.status));sessionStorage.setItem(KEY,t);if(saveToken.checked)localStorage.setItem(KEY,t);token.value="";state(true,"Connected");status.textContent="✓ GitHub connected. Upload ready.";load()}catch(e){state(false,"Not connected");status.textContent="❌ "+e.message}finally{connect.disabled=false}}
async function load(){try{const r=await fetch("../data/chapters.json?v="+Date.now(),{cache:"no-store"});const d=await r.json();chapters=d.chapters||[];const s=document.getElementById("chapterSelect");s.innerHTML='<option value="">Select chapter to edit</option>';chapters.forEach(c=>{const o=document.createElement("option");o.value=c.slug;o.textContent=(c.manga_slug||"Manga")+" — "+(c.title||("Chapter "+c.number));s.appendChild(o)});if(chapters[0]){s.value=chapters[0].slug;fill(chapters[0])}}catch(e){status.textContent="❌ Chapter load error: "+e.message}}
function fill(c){cslug.value=c.slug||"";mangaSlug.value=c.manga_slug||"";number.value=c.number||"";chapterTitle.value=c.title||"";pages.value=JSON.stringify(c.pages||[],null,2)}
chapterSelect.onchange=()=>{const c=chapters.find(x=>x.slug===chapterSelect.value);if(c)fill(c)};refreshChapters.onclick=load;connect.onclick=()=>verify(token.value.trim());clear.onclick=()=>{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY);state(false,"Not connected");status.textContent="Token cleared."};
const saved=localStorage.getItem(KEY)||sessionStorage.getItem(KEY);if(saved){saveToken.checked=!!localStorage.getItem(KEY);verify(saved)}
</script></body></html>
