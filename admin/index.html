<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaReader Admin</title><link rel="stylesheet" href="admin.css"></head><body><main><h1>MangaReader Admin</h1><p>GitHub-only control panel. Token stays in this browser.</p><label>GitHub token<input id="token" type="password" autocomplete="off"></label><button id="save">Save locally</button><button id="clear">Clear</button><div id="loginGate"><h2>Admin Login</h2><p>Connect a GitHub token to unlock management tools.</p><button id="connect">Connect GitHub</button><span id="loginStatus"></span></div><section id="panel" hidden><hr><h2>Manga</h2><input id="slug" placeholder="slug"><input id="title" placeholder="title"><input id="country" placeholder="country (JP/FR/US...)"><input id="author" placeholder="author"><input id="cover" placeholder="cover path"><textarea id="description" placeholder="description"></textarea><button id="manga">Save manga</button><hr><h2>Chapter Manager</h2><select id="chapterSelect"><option value="">Select chapter to edit</option></select><button id="refreshChapters">Refresh chapters</button><input id="cslug" placeholder="chapter slug"><input id="mangaSlug" placeholder="manga slug"><input id="number" placeholder="chapter number"><input id="chapterTitle" placeholder="chapter title"><label>Chapter images<input id="imageFiles" type="file" accept="image/*" multiple></label><button id="uploadImages">Upload selected images to GitHub</button><textarea id="pages" placeholder="Uploaded page paths will appear here"></textarea><button id="chapter">Save / Update chapter</button><button id="deleteChapter">Delete chapter</button></section><pre id="status"></pre></main><script src="admin.js"></script></body></html>
