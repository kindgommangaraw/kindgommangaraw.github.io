<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MangaReader Admin</title><link rel="stylesheet" href="admin.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f5f7;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px 50px}.panel{background:#101118;border:1px solid #272b36;border-radius:14px;padding:20px;margin:14px 0}.hero{border-color:#334d77}.muted{color:#9299a8;font-size:13px;line-height:1.6}label{display:block;font-size:13px;color:#aeb3c0;margin:12px 0 6px}input,textarea,select{width:100%;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;font:inherit;outline:none;margin-bottom:8px}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:#fff;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.5;cursor:not-allowed}.token-row,.grid{display:grid;grid-template-columns:1fr auto;gap:10px}.grid{grid-template-columns:1fr 1fr}.state{font-size:13px;font-weight:700}.bad{color:#f0aeb8}.good{color:#8ee6ad}.status{padding:10px;border-radius:8px;background:#171b23;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.danger{background:#8f3f4d}.save-token{display:flex;align-items:center;gap:8px}.save-token input{width:auto}.cover-preview{display:block;max-width:180px;max-height:240px;border-radius:10px;margin:8px 0;border:1px solid #303542}.small{font-size:12px;color:#7f8797}@media(max-width:700px){.token-row,.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<div class="panel hero"><h1>⚙️ MangaReader Admin</h1><p class="muted">GitHub-powered control panel.</p><div class="token-row"><div><label>GitHub Token</label><input id="token" type="password" autocomplete="off"></div><button id="connect" type="button">🔗 Connect GitHub</button></div><label class="save-token"><input id="saveToken" type="checkbox"> Save token in this browser</label><div id="loginStatus" class="state bad">● Not connected</div><button id="clear" type="button">Clear saved token</button><div id="status" class="status">Admin build 20260908-18 — checking connection…</div></div>

<section id="panel">
<div class="panel"><h2>📚 Manga Manager</h2>
<label>Existing manga</label><select id="mangaSelect"><option value="">➕ Add new manga</option></select>
<div class="grid"><div><label>Slug *</label><input id="slug" placeholder="kingdom-raw"></div><div><label>Title *</label><input id="title" placeholder="Kingdom Raw"></div></div>
<div class="grid"><div><label>Japanese title</label><input id="japaneseTitle"></div><div><label>Country</label><input id="country" value="JP"></div></div>
<div class="grid"><div><label>Author</label><input id="author"></div><div><label>Artist</label><input id="artist"></div></div>
<div class="grid"><div><label>Status</label><select id="mangaStatus"><option value="Ongoing">Ongoing</option><option value="Completed">Completed</option><option value="Hiatus">Hiatus</option></select></div><div><label>Genres</label><input id="genres" placeholder="Action, Adventure, Drama"></div></div>
<label>Description</label><textarea id="description"></textarea>
<label>Cover image</label><input id="coverFile" type="file" accept="image/*"><div class="small">Cover is uploaded to <b>manga-covers/{slug}.ext</b> and saved automatically in manga.json.</div><img id="coverPreview" class="cover-preview" alt="" hidden>
<label>Saved cover path</label><input id="cover" placeholder="/manga-covers/kingdom-raw.jpg">
<div><button id="newManga" type="button">➕ New manga</button><button id="saveManga" type="button">💾 Save manga</button><button id="deleteManga" class="danger" type="button">🗑 Delete manga</button></div>
</div>

<div class="panel"><h2>📖 Chapter Manager</h2><label>Existing chapter</label><select id="chapterSelect"><option value="">Select chapter to edit</option></select><button id="refreshChapters" type="button">Refresh chapters</button><div class="grid"><div><label>Chapter slug</label><input id="cslug"></div><div><label>Manga slug</label><input id="mangaSlug"></div></div><div class="grid"><div><label>Chapter number</label><input id="number"></div><div><label>Chapter title</label><input id="chapterTitle"></div></div><label>Chapter images</label><input id="imageFiles" type="file" accept="image/*" multiple><button id="uploadImages" type="button">⬆️ Upload selected images</button><label>Uploaded page paths</label><textarea id="pages"></textarea><div><button id="chapter" type="button">💾 Save / Update chapter</button><button id="deleteChapter" class="danger" type="button">🗑 Delete chapter</button></div></div>
</section></main>
<script>
const KEY="mr_admin_token",REPO="kindgommangaraw/kindgommangaraw.github.io";
const $=id=>document.getElementById(id),token=$("token"),connect=$("connect"),status=$("status"),loginStatus=$("loginStatus"),saveToken=$("saveToken");
let mangas=[],chapters=[];
const state=(ok,t)=>{loginStatus.className="state "+(ok?"good":"bad");loginStatus.textContent="● "+t};
const auth=()=>sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||token.value.trim()||(()=>{throw Error("GitHub is not connected.")})();
async function api(path,opt={},timeout=30000){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+path,{...opt,signal:ctl.signal,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+auth(),"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json",...(opt.headers||{})},cache:"no-store"});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error("GitHub HTTP "+r.status+": "+(d.message||"Request failed"));return d}catch(e){if(e.name==="AbortError")throw Error("GitHub request timed out after 30 seconds: "+path);throw e}finally{clearTimeout(timer)}}
async function sha(path){try{return(await api(path,{},15000)).sha}catch(e){if(e.message.includes("GitHub HTTP 404"))return null;throw e}}
async function b64(f){const u=new Uint8Array(await f.arrayBuffer());let s="";for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)}
async function putFile(path,content,message){let s=await sha(path),body={message,content,branch:"main"};if(s)body.sha=s;try{return await api(path,{method:"PUT",body:JSON.stringify(body)},90000)}catch(e){if(e.message.includes("422")&&e.message.includes("sha")){s=await sha(path);if(!s)throw e;body.sha=s;return await api(path,{method:"PUT",body:JSON.stringify(body)},90000)}throw e}}
async function getJson(path){const d=await api(path+"?ref=main",{},20000);return JSON.parse(atob(d.content.replace(/\n/g,"")))}
async function saveJson(path,obj,message){for(let attempt=0;attempt<2;attempt++){const d=await api(path+"?ref=main",{},20000);const content=btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,2)+"\n")));try{return await api(path,{method:"PUT",body:JSON.stringify({message,content,branch:"main",sha:d.sha})},30000)}catch(e){if(!e.message.includes("409")&&!e.message.includes("422"))throw e}}throw Error("GitHub changed the file while saving. Please try again.")}
async function listDir(path){const d=await api(path+"?ref=main",{},15000);return Array.isArray(d)?d:[]}
function slugify(v){return v.trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
async function loadMangas(){try{const d=await getJson("data/manga.json");mangas=d.manga||[];const s=$("mangaSelect");s.innerHTML='<option value="">➕ Add new manga</option>';mangas.forEach(m=>{const o=document.createElement("option");o.value=m.slug;o.textContent=m.title||m.slug;s.appendChild(o)});status.textContent="✓ Manga database loaded: "+mangas.length}catch(e){status.textContent="❌ Manga load error: "+e.message}}
function clearMangaForm(){["slug","title","japaneseTitle","author","artist","genres","description","cover"].forEach(id=>$(id).value="");$("country").value="JP";$("mangaStatus").value="Ongoing";$("coverFile").value="";$("coverPreview").hidden=true;$("mangaSelect").value=""}
function fillManga(m){$("slug").value=m.slug||"";$("title").value=m.title||"";$("japaneseTitle").value=m.japanese_title||m.japaneseTitle||"";$("country").value=m.country||"JP";$("author").value=m.author||"";$("artist").value=m.artist||"";$("mangaStatus").value=m.status||"Ongoing";$("genres").value=Array.isArray(m.genres)?m.genres.join(", "):m.genres||"";$("description").value=m.description||"";$("cover").value=m.cover||"";$("coverFile").value="";if(m.cover){$("coverPreview").src=m.cover+"?v="+Date.now();$("coverPreview").hidden=false}else $("coverPreview").hidden=true}
$("mangaSelect").onchange=()=>{const m=mangas.find(x=>x.slug===$("mangaSelect").value);m?fillManga(m):clearMangaForm()};$("newManga").onclick=clearMangaForm;
$("coverFile").onchange=()=>{const f=$("coverFile").files[0];if(f){$("coverPreview").src=URL.createObjectURL(f);$("coverPreview").hidden=false}};
async function saveManga(){const b=$("saveManga");try{let slug=$("slug").value.trim()||slugify($("title").value);const title=$("title").value.trim();if(!slug||!title)throw Error("Slug and title are required.");if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))throw Error("Slug must use lowercase letters, numbers and hyphens only.");b.disabled=true;b.textContent="⏳ Saving...";let cover=$("cover").value.trim();const file=$("coverFile").files[0];if(file){if(file.size>10*1024*1024)throw Error("Cover image is larger than 10 MB.");const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path="manga-covers/"+slug+"."+ext;status.textContent="Uploading manga cover...";await putFile(path,await b64(file),"Admin: upload manga cover");cover="/"+path}
const item={slug,title,japanese_title:$("japaneseTitle").value.trim(),country:$("country").value.trim()||"JP",author:$("author").value.trim(),artist:$("artist").value.trim(),status:$("mangaStatus").value,genres:$("genres").value.split(",").map(x=>x.trim()).filter(Boolean),cover,description:$("description").value.trim()};
const latest=await getJson("data/manga.json"),arr=latest.manga||[];const oldSlug=$("mangaSelect").value;const idx=arr.findIndex(m=>m.slug===oldSlug);const dup=arr.findIndex(m=>m.slug===slug);if(idx>=0){if(dup>=0&&dup!==idx)throw Error("That slug already belongs to another manga.");arr[idx]=item}else{if(dup>=0)throw Error("A manga with this slug already exists.");arr.push(item)}latest.manga=arr;await saveJson("data/manga.json",latest,"Admin: save manga");await updateSitemap(arr);status.textContent="✓ Manga saved: "+title;await loadMangas();$("mangaSelect").value=slug;fillManga(item)}catch(e){status.textContent="❌ MANGA ERROR: "+e.message;console.error(e)}finally{b.disabled=false;b.textContent="💾 Save manga"}}
$("saveManga").onclick=saveManga;
async function deleteManga(){const slug=$("mangaSelect").value;if(!slug)return alert("Select a manga first.");const m=mangas.find(x=>x.slug===slug);if(!confirm("Delete manga record '"+(m?.title||slug)+"'? Chapters and images will NOT be deleted."))return;try{const latest=await getJson("data/manga.json");latest.manga=(latest.manga||[]).filter(x=>x.slug!==slug);await saveJson("data/manga.json",latest,"Admin: delete manga record");await updateSitemap(latest.manga);clearMangaForm();await loadMangas();status.textContent="✓ Manga record deleted. Chapters/images were kept."}catch(e){status.textContent="❌ DELETE ERROR: "+e.message}}
$("deleteManga").onclick=deleteManga;
async function updateSitemap(list){try{const sm=await api("sitemap.xml?ref=main",{},15000);const xml=atob(sm.content.replace(/\n/g,""));const urls=new Set();const re=/<loc>([^<]+)<\\/loc>/g;let m;while((m=re.exec(xml)))urls.add(m[1]);list.forEach(x=>urls.add("https://kindgommangaraw.github.io/manga.html?slug="+encodeURIComponent(x.slug)));const out='<?xml version="1.0" encoding="UTF-8"?>\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+[...urls].map(u=>'  <url>\n    <loc>'+u+'</loc>\n  </url>').join("\n")+'\n</urlset>\n';await api("sitemap.xml",{method:"PUT",body:JSON.stringify({message:"Admin: update sitemap",content:btoa(unescape(encodeURIComponent(out))),branch:"main",sha:sm.sha})},30000)}catch(e){console.warn("Sitemap update failed",e);}}
async function loadChapters(){try{const d=await getJson("data/chapters.json");chapters=d.chapters||[];const s=$("chapterSelect");s.innerHTML='<option value="">Select chapter to edit</option>';chapters.forEach(c=>{const o=document.createElement("option");o.value=c.slug;o.textContent=(c.manga_slug||"Manga")+" — "+(c.title||("Chapter "+c.number));s.appendChild(o)});if(chapters[0]){s.value=chapters[0].slug;fillChapter(chapters[0])}}catch(e){status.textContent="❌ Chapter load error: "+e.message}}
function fillChapter(c){$("cslug").value=c.slug||"";$("mangaSlug").value=c.manga_slug||"";$("number").value=c.number||"";$("chapterTitle").value=c.title||"";$("pages").value=JSON.stringify(c.pages||[],null,2)}
$("chapterSelect").onchange=()=>{const c=chapters.find(x=>x.slug===$("chapterSelect").value);if(c)fillChapter(c)};$("refreshChapters").onclick=loadChapters;
async function upload(){const b=$("uploadImages");try{const m=$("mangaSlug").value.trim(),n=$("number").value.trim(),files=[...$("imageFiles").files];if(!m||!n)throw Error("Select/load a chapter first.");if(!files.length)throw Error("Select an image first.");b.disabled=true;b.textContent="⏳ Uploading...";const dir="chapter-images/"+m+"/chapter-"+n+"/";let existing=[];try{existing=await listDir(dir)}catch(e){if(!e.message.includes("404"))throw e}const used=new Set(existing.map(x=>x.name));let next=1;while([...used].some(x=>new RegExp("^"+String(next).padStart(3,"0")+"\\\\.(jpg|jpeg|png|webp|gif)$","i").test(x)))next++;const pages=[];files.sort((a,z)=>a.name.localeCompare(z.name,undefined,{numeric:true}));for(let i=0;i<files.length;i++){const f=files[i],ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",name=String(next+i).padStart(3,"0")+"."+ext,path=dir+name;if(f.size>90*1024*1024)throw Error(f.name+" is larger than 90 MB.");status.textContent="Uploading "+name+" ("+(i+1)+"/"+files.length+")...";await putFile(path,await b64(f),"Admin: upload chapter image");pages.push("/"+path)}const all=existing.filter(x=>/^\d+\.(jpg|jpeg|png|webp|gif)$/i.test(x.name)).map(x=>"/"+dir+x.name).concat(pages).sort((a,z)=>a.localeCompare(z,undefined,{numeric:true}));$("pages").value=JSON.stringify(all,null,2);status.textContent="✓ Upload complete: "+all.length+" images. Save / Update chapter now."}catch(e){status.textContent="❌ UPLOAD ERROR: "+e.message}finally{b.disabled=false;b.textContent="⬆️ Upload selected images"}}
$("uploadImages").onclick=upload;
async function saveChapter(){try{const slug=$("cslug").value.trim(),mangaSlug=$("mangaSlug").value.trim();if(!slug||!mangaSlug)throw Error("Chapter slug and manga slug are required.");let p=[];try{p=JSON.parse($("pages").value||"[]")}catch{throw Error("Pages must be valid JSON.")}const latest=await getJson("data/chapters.json"),arr=latest.chapters||[],item={id:slug,manga_slug:mangaSlug,title:$("chapterTitle").value.trim(),number:Number($("number").value),slug,country:"JP",pages:p};const idx=arr.findIndex(x=>x.slug===slug);if(idx>=0)arr[idx]=item;else arr.push(item);latest.chapters=arr;await saveJson("data/chapters.json",latest,"Admin: save chapter");await updateSitemap(mangas);status.textContent="✓ Chapter saved.";await loadChapters()}catch(e){status.textContent="❌ CHAPTER ERROR: "+e.message}}
$("chapter").onclick=saveChapter;
async function deleteChapter(){const slug=$("chapterSelect").value;if(!slug)return alert("Select a chapter first.");if(!confirm("Delete this chapter record? Images will remain in GitHub."))return;try{const latest=await getJson("data/chapters.json");latest.chapters=(latest.chapters||[]).filter(x=>x.slug!==slug);await saveJson("data/chapters.json",latest,"Admin: delete chapter");await updateSitemap(mangas);status.textContent="✓ Chapter deleted. Images were kept.";await loadChapters()}catch(e){status.textContent="❌ DELETE ERROR: "+e.message}}
$("deleteChapter").onclick=deleteChapter;
async function verify(t){try{if(!t)throw Error("Enter your GitHub token.");connect.disabled=true;status.textContent="Checking GitHub...";const r=await fetch("https://api.github.com/repos/"+REPO,{headers:{Authorization:"Bearer "+t,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},cache:"no-store"});if(!r.ok)throw Error((await r.json()).message||("HTTP "+r.status));sessionStorage.setItem(KEY,t);if(saveToken.checked)localStorage.setItem(KEY,t);token.value="";state(true,"Connected");status.textContent="✓ GitHub connected. Admin ready. Build 20260908-18";await loadMangas();await loadChapters()}catch(e){state(false,"Not connected");status.textContent="❌ "+e.message}finally{connect.disabled=false}}
connect.onclick=()=>verify(token.value.trim());$("clear").onclick=()=>{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY);state(false,"Not connected");status.textContent="Token cleared."};
const saved=localStorage.getItem(KEY)||sessionStorage.getItem(KEY);if(saved){saveToken.checked=!!localStorage.getItem(KEY);verify(saved)}else status.textContent="Admin build 20260908-18 — GitHub not connected.";
</script></body></html>
