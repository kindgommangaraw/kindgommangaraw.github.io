<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MangaReader Admin</title><link rel="stylesheet" href="admin.css"><style>*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f5f7;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px 50px}.panel{background:#101118;border:1px solid #272b36;border-radius:14px;padding:20px;margin:14px 0}.hero{border-color:#334d77}.muted,.small{color:#9299a8;font-size:13px;line-height:1.6}label{display:block;font-size:13px;color:#aeb3c0;margin:12px 0 6px}input,textarea,select{width:100%;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;font:inherit;outline:none;margin-bottom:8px}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:#fff;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}.danger{background:#8f3f4d}.success{background:#2f8b57}.row,.grid{display:grid;grid-template-columns:1fr auto;gap:10px}.grid{grid-template-columns:1fr 1fr}.state{font-size:13px;font-weight:700;margin-top:8px}.bad{color:#f0aeb8}.good{color:#8ee6ad}.status{padding:10px;border-radius:8px;background:#171b23;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.save-token{display:flex;align-items:center;gap:8px}.save-token input{width:auto}.preview{display:block;max-width:180px;max-height:240px;border-radius:10px;margin:8px 0;border:1px solid #303542}.picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.picker button{margin:0}.name{color:#aeb3c0;font-size:13px}@media(max-width:700px){.row,.grid{grid-template-columns:1fr}}</style></head><body><main>
<div class="panel hero"><h1>⚙️ MangaReader Admin</h1><p class="muted">GitHub-powered control panel.</p><div class="row"><div><label>GitHub Token</label><input id="token" type="password" autocomplete="off" placeholder="Paste token here"></div><button id="connect" type="button">🔗 Connect GitHub</button></div><label class="save-token"><input id="saveToken" type="checkbox"> Save token in this browser</label><div id="loginStatus" class="state bad">● Not connected</div><button id="clear" type="button">Clear saved token</button><div id="status" class="status">Admin build 20260908-21 — cover uploader fixed.</div></div>
<div class="panel"><h2>📚 Manga Manager</h2><label>Existing manga</label><select id="mangaSelect"><option value="">➕ Add new manga</option></select><div class="grid"><div><label>Slug *</label><input id="slug" placeholder="kingdom-raw"></div><div><label>Title *</label><input id="title" placeholder="Kingdom Raw"></div></div><div class="grid"><div><label>Japanese title</label><input id="japaneseTitle"></div><div><label>Country</label><input id="country" value="JP"></div></div><div class="grid"><div><label>Author</label><input id="author"></div><div><label>Artist</label><input id="artist"></div></div><div class="grid"><div><label>Status</label><select id="mangaStatus"><option>Ongoing</option><option>Completed</option><option>Hiatus</option></select></div><div><label>Genres</label><input id="genres" placeholder="Action, Adventure, Drama"></div></div><label>Description</label><textarea id="description"></textarea><label>🖼️ Cover image</label><div class="picker"><button id="chooseCover" type="button">🖼️ Choose Cover Image</button><button id="uploadCover" class="success" type="button">⬆️ Upload Cover</button><span id="coverName" class="name">No cover selected</span></div><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden><img id="coverPreview" class="preview" hidden alt="Cover preview"><label>Saved cover path</label><input id="cover" placeholder="/manga-covers/kingdom-raw.webp"><button id="newManga" type="button">➕ New manga</button><button id="saveManga" type="button">💾 Save manga</button><button id="deleteManga" class="danger" type="button">🗑 Delete manga</button></div>
<div class="panel"><h2>📖 Chapter Manager</h2><label>Existing chapter</label><select id="chapterSelect"><option value="">Select chapter to edit</option></select><button id="refreshChapters" type="button">Refresh chapters</button><div class="grid"><div><label>Chapter slug</label><input id="cslug" placeholder="kingdom-raw-887"></div><div><label>Manga slug</label><input id="mangaSlug" placeholder="kingdom-raw"></div></div><div class="grid"><div><label>Chapter number</label><input id="number" type="number"></div><div><label>Chapter title</label><input id="chapterTitle"></div></div><label>Chapter images</label><input id="imageFiles" type="file" accept="image/*" multiple><button id="uploadImages" type="button">⬆️ Upload selected images</button><label>Uploaded page paths</label><textarea id="pages"></textarea><button id="saveChapter" type="button">💾 Save / Update chapter</button><button id="deleteChapter" class="danger" type="button">🗑 Delete chapter</button></div></main>
<script>
const REPO="kindgommangaraw/kindgommangaraw.github.io",KEY="mangaatlas_github_token",OLD="mr_admin_token",$=id=>document.getElementById(id);let mangas=[],chapters=[];
function token(){return sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||sessionStorage.getItem(OLD)||localStorage.getItem(OLD)||$("token").value.trim()}function auth(){const t=token();if(!t)throw Error("GitHub is not connected.");return t}function state(ok,t){$("loginStatus").className="state "+(ok?"good":"bad");$("loginStatus").textContent="● "+t}
async function api(path,opt={},timeout=30000){const c=new AbortController(),tm=setTimeout(()=>c.abort(),timeout);try{const r=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+path,{...opt,signal:c.signal,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+auth(),"X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{})},cache:"no-store"});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error("GitHub HTTP "+r.status+": "+(d.message||"Request failed"));return d}catch(e){if(e.name==="AbortError")throw Error("GitHub request timed out.");throw e}finally{clearTimeout(tm)}}
async function verify(t){t=(t||"").trim();if(!t)return state(false,"Not connected");$("connect").disabled=true;$("status").textContent="Checking GitHub token...";try{const r=await fetch("https://api.github.com/repos/"+REPO,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+t,"X-GitHub-Api-Version":"2022-11-28"},cache:"no-store"}),d=await r.json();if(!r.ok)throw Error(d.message||("HTTP "+r.status));sessionStorage.setItem(KEY,t);if($("saveToken").checked)localStorage.setItem(KEY,t);else localStorage.removeItem(KEY);sessionStorage.removeItem(OLD);localStorage.removeItem(OLD);$("token").value="";state(true,"Connected");await loadMangas();await loadChapters();$("status").textContent="✓ GitHub connected. Admin ready."}catch(e){state(false,"Not connected");$("status").textContent="❌ Connection failed: "+e.message}finally{$("connect").disabled=false}}
$("connect").onclick=()=>verify($("token").value);$("clear").onclick=()=>{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY);sessionStorage.removeItem(OLD);localStorage.removeItem(OLD);$("token").value="";state(false,"Not connected");$("status").textContent="Token cleared."};
async function json(path){const d=await api(path+"?ref=main",{},20000);return JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,"")))))}async function enc(s){return btoa(unescape(encodeURIComponent(s)))}async function saveJson(path,obj,msg){for(let i=0;i<3;i++){const d=await api(path+"?ref=main",{},20000);try{return await api(path,{method:"PUT",body:JSON.stringify({message:msg,content:await enc(JSON.stringify(obj,null,2)+"\n"),branch:"main",sha:d.sha})},30000)}catch(e){if(!/409|422/.test(e.message)||i===2)throw e}}}async function sha(path){try{return(await api(path+"?ref=main",{},15000)).sha}catch(e){if(e.message.includes("404"))return null;throw e}}async function put(path,content,msg){for(let i=0;i<3;i++){const s=await sha(path),b={message:msg,content,branch:"main"};if(s)b.sha=s;try{return await api(path,{method:"PUT",body:JSON.stringify(b)},90000)}catch(e){if(!/409|422/.test(e.message)||i===2)throw e}}}
async function b64(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const s=String(r.result||"");const i=s.indexOf(",");resolve(i>=0?s.slice(i+1):s)};r.onerror=()=>reject(Error("Could not read the image file."));r.readAsDataURL(f)})}
function clearM(){["slug","title","japaneseTitle","author","artist","genres","description","cover"].forEach(x=>$(x).value="");$("country").value="JP";$("mangaStatus").value="Ongoing";$("coverFile").value="";$("coverName").textContent="No cover selected";$("coverPreview").hidden=true;$("mangaSelect").value=""}
function fillM(m){$("slug").value=m.slug||"";$("title").value=m.title||"";$("japaneseTitle").value=m.japanese_title||"";$("country").value=m.country||"JP";$("author").value=m.author||"";$("artist").value=m.artist||"";$("mangaStatus").value=m.status||"Ongoing";$("genres").value=Array.isArray(m.genres)?m.genres.join(", "):m.genres||"";$("description").value=m.description||"";$("cover").value=m.cover||"";$("coverPreview").hidden=!m.cover;if(m.cover)$("coverPreview").src=m.cover+"?v="+Date.now()}
async function loadMangas(){const d=await json("data/manga.json");mangas=d.manga||[];$("mangaSelect").innerHTML='<option value="">➕ Add new manga</option>';mangas.forEach(m=>{const o=document.createElement("option");o.value=m.slug;o.textContent=m.title||m.slug;$("mangaSelect").appendChild(o)})}$("mangaSelect").onchange=()=>{const m=mangas.find(x=>x.slug===$("mangaSelect").value);m?fillM(m):clearM()};$("newManga").onclick=clearM;
$("chooseCover").onclick=()=>$("coverFile").click();$("coverFile").onchange=()=>{const f=$("coverFile").files[0];if(f){$("coverName").textContent=f.name;$("coverPreview").src=URL.createObjectURL(f);$("coverPreview").hidden=false}};
async function uploadCover(){const b=$("uploadCover"),f=$("coverFile").files[0],slug=$("slug").value.trim();try{if(!f)throw Error("Choose a cover image first.");if(!slug)throw Error("Enter the manga slug first.");if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))throw Error("Slug must use lowercase letters, numbers and hyphens only.");if(f.size>10*1024*1024)throw Error("Cover image is larger than 10 MB.");const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",p="manga-covers/"+slug+"."+ext;b.disabled=true;b.textContent="⏳ Uploading...";$("status").textContent="Uploading cover to GitHub...";await put(p,await b64(f),"Admin: upload manga cover");const publicPath="/"+p;$("cover").value=publicPath;$("coverPreview").src=publicPath+"?v="+Date.now();$("coverPreview").hidden=false;$("status").textContent="✓ Cover uploaded to GitHub: "+publicPath}catch(e){$("status").textContent="❌ COVER UPLOAD ERROR: "+e.message}finally{b.disabled=false;b.textContent="⬆️ Upload Cover"}}$("uploadCover").onclick=uploadCover;
async function saveManga(){const b=$("saveManga");try{let slug=$("slug").value.trim()||$("title").value.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""),title=$("title").value.trim();if(!slug||!title)throw Error("Slug and title are required.");if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))throw Error("Slug must use lowercase letters, numbers and hyphens only.");b.disabled=true;b.textContent="⏳ Saving...";const item={slug,title,japanese_title:$("japaneseTitle").value.trim(),country:$("country").value.trim()||"JP",author:$("author").value.trim(),artist:$("artist").value.trim(),status:$("mangaStatus").value,genres:$("genres").value.split(",").map(x=>x.trim()).filter(Boolean),cover:$("cover").value.trim(),description:$("description").value.trim()},d=await json("data/manga.json"),arr=d.manga||[],old=$("mangaSelect").value,i=arr.findIndex(x=>x.slug===old),dup=arr.findIndex(x=>x.slug===slug);if(i>=0){if(dup>=0&&dup!==i)throw Error("That slug already belongs to another manga.");arr[i]=item}else{if(dup>=0)throw Error("A manga with this slug already exists.");arr.push(item)}d.manga=arr;await saveJson("data/manga.json",d,"Admin: save manga");await loadMangas();$("mangaSelect").value=slug;fillM(item);$("status").textContent="✓ Manga saved: "+title}catch(e){$("status").textContent="❌ MANGA ERROR: "+e.message}finally{b.disabled=false;b.textContent="💾 Save manga"}}$("saveManga").onclick=saveManga;
async function deleteManga(){const s=$("mangaSelect").value;if(!s)return alert("Select a manga first.");if(!confirm("Delete this manga record? Chapters and images will NOT be deleted."))return;try{const d=await json("data/manga.json");d.manga=(d.manga||[]).filter(x=>x.slug!==s);await saveJson("data/manga.json",d,"Admin: delete manga");clearM();await loadMangas();$("status").textContent="✓ Manga record deleted. Chapters/images kept."}catch(e){$("status").textContent="❌ DELETE ERROR: "+e.message}}$("deleteManga").onclick=deleteManga;
function fillC(c){$("cslug").value=c.slug||"";$("mangaSlug").value=c.manga_slug||"";$("number").value=c.number||"";$("chapterTitle").value=c.title||"";$("pages").value=JSON.stringify(c.pages||[],null,2)}async function loadChapters(){const d=await json("data/chapters.json");chapters=d.chapters||[];$("chapterSelect").innerHTML='<option value="">Select chapter to edit</option>';chapters.forEach(c=>{const o=document.createElement("option");o.value=c.slug;o.textContent=(c.manga_slug||"Manga")+" — "+(c.title||("Chapter "+c.number));$("chapterSelect").appendChild(o)});if(chapters[0]){$("chapterSelect").value=chapters[0].slug;fillC(chapters[0])}}$("chapterSelect").onchange=()=>{const c=chapters.find(x=>x.slug===$("chapterSelect").value);if(c)fillC(c)};$("refreshChapters").onclick=loadChapters;
async function uploadImages(){const files=[...$("imageFiles").files],m=$("mangaSlug").value.trim(),n=$("number").value.trim();if(!m||!n||!files.length)return alert("Select manga, chapter number and images first.");if(!confirm("Replace all existing images for this chapter?\n\nAll old images will be deleted first, then the new selected images will be uploaded."))return;const b=$("uploadImages");b.disabled=true;try{const dir="chapter-images/"+m+"/chapter-"+n+"/";const old=await api(dir+"?ref=main",{},30000).catch(e=>e.message.includes("404")?[]:Promise.reject(e));const oldFiles=Array.isArray(old)?old.filter(x=>x.type==="file"):[];$("status").textContent="Removing old images...";for(const f of oldFiles)await api(f.path,{method:"DELETE",body:JSON.stringify({message:"Admin: remove old chapter image",sha:f.sha,branch:"main"})},30000);files.sort((a,z)=>a.name.localeCompare(z.name,undefined,{numeric:true}));const pages=[];for(let i=0;i<files.length;i++){const f=files[i];const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const name=String(i+1).padStart(3,"0")+"."+ext;$("status").textContent="Uploading "+name+" ("+(i+1)+"/"+files.length+")...";await put(dir+name,await b64(f),"Admin: upload replacement chapter image");pages.push("/"+dir+name+"?v="+Date.now());}$("pages").value=JSON.stringify(pages,null,2);$("status").textContent="✓ Old images replaced. "+files.length+" new image(s) uploaded. Click Save / Update chapter."}catch(e){$("status").textContent="❌ UPLOAD ERROR: "+e.message}finally{b.disabled=false}}$("uploadImages").onclick=uploadImages;
async function saveChapter(){try{const slug=$("cslug").value.trim(),m=$("mangaSlug").value.trim();if(!slug||!m)throw Error("Chapter slug and manga slug are required.");const d=await json("data/chapters.json"),arr=d.chapters||[],item={id:slug,manga_slug:m,title:$("chapterTitle").value.trim(),number:Number($("number").value),slug,country:"JP",pages:JSON.parse($("pages").value||"[]")},i=arr.findIndex(x=>x.slug===slug);if(i>=0)arr[i]=item;else arr.push(item);d.chapters=arr;await saveJson("data/chapters.json",d,"Admin: save chapter");await loadChapters();$("status").textContent="✓ Chapter saved."}catch(e){$("status").textContent="❌ CHAPTER ERROR: "+e.message}}$("saveChapter").onclick=saveChapter;
async function deleteChapter(){const s=$("chapterSelect").value;if(!s)return alert("Select a chapter first.");if(!confirm("Delete this chapter record? Images will remain in GitHub."))return;try{const d=await json("data/chapters.json");d.chapters=(d.chapters||[]).filter(x=>x.slug!==s);await saveJson("data/chapters.json",d,"Admin: delete chapter");await loadChapters();$("status").textContent="✓ Chapter deleted. Images kept."}catch(e){$("status").textContent="❌ DELETE ERROR: "+e.message}}$("deleteChapter").onclick=deleteChapter;
const saved=token();if(saved){$("saveToken").checked=!!localStorage.getItem(KEY)||!!localStorage.getItem(OLD);verify(saved)}
</script></body></html>
