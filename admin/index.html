<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MangaReader Admin</title>
<link rel="stylesheet" href="admin.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f4f5f7;font-family:Inter,system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:24px 16px 50px}.panel{background:#101118;border:1px solid #272b36;border-radius:14px;padding:20px;margin:14px 0}.hero{border-color:#334d77}.muted,.small{color:#9299a8;font-size:13px;line-height:1.6}label{display:block;font-size:13px;color:#aeb3c0;margin:12px 0 6px}input,textarea,select{width:100%;background:#090b10;color:#fff;border:1px solid #303542;border-radius:8px;padding:10px;font:inherit;outline:none;margin-bottom:8px}textarea{min-height:110px;resize:vertical}button{border:0;border-radius:8px;padding:10px 14px;background:#3f73c9;color:#fff;font-weight:700;cursor:pointer;margin:4px 4px 4px 0}button:disabled{opacity:.5;cursor:not-allowed}.row,.grid{display:grid;grid-template-columns:1fr auto;gap:10px}.grid{grid-template-columns:1fr 1fr}.state{font-size:13px;font-weight:700;margin-top:8px}.bad{color:#f0aeb8}.good{color:#8ee6ad}.status{padding:10px;border-radius:8px;background:#171b23;margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere}.danger{background:#8f3f4d}.save-token{display:flex;align-items:center;gap:8px}.save-token input{width:auto}.preview{display:block;max-width:180px;max-height:240px;border-radius:10px;margin:8px 0;border:1px solid #303542}@media(max-width:700px){.row,.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<div class="panel hero">
<h1>⚙️ MangaReader Admin</h1><p class="muted">GitHub-powered control panel.</p>
<div class="row"><div><label>GitHub Token</label><input id="token" type="password" autocomplete="off" placeholder="Paste token here"></div><button id="connect" type="button">🔗 Connect GitHub</button></div>
<label class="save-token"><input id="saveToken" type="checkbox"> Save token in this browser</label>
<div id="loginStatus" class="state bad">● Not connected</div><button id="clear" type="button">Clear saved token</button>
<div id="status" class="status">Admin build 20260908-19 — ready.</div>
</div>

<div class="panel"><h2>📚 Manga Manager</h2>
<label>Existing manga</label><select id="mangaSelect"><option value="">➕ Add new manga</option></select>
<div class="grid"><div><label>Slug *</label><input id="slug" placeholder="kingdom-raw"></div><div><label>Title *</label><input id="title" placeholder="Kingdom Raw"></div></div>
<div class="grid"><div><label>Japanese title</label><input id="japaneseTitle"></div><div><label>Country</label><input id="country" value="JP"></div></div>
<div class="grid"><div><label>Author</label><input id="author"></div><div><label>Artist</label><input id="artist"></div></div>
<div class="grid"><div><label>Status</label><select id="mangaStatus"><option>Ongoing</option><option>Completed</option><option>Hiatus</option></select></div><div><label>Genres</label><input id="genres" placeholder="Action, Adventure, Drama"></div></div>
<label>Description</label><textarea id="description"></textarea>
<label>Cover image</label><input id="coverFile" type="file" accept="image/*"><img id="coverPreview" class="preview" hidden alt="">
<label>Saved cover path</label><input id="cover" placeholder="/manga-covers/kingdom-raw.jpg">
<button id="newManga" type="button">➕ New manga</button><button id="saveManga" type="button">💾 Save manga</button><button id="deleteManga" class="danger" type="button">🗑 Delete manga</button>
</div>

<div class="panel"><h2>📖 Chapter Manager</h2>
<label>Existing chapter</label><select id="chapterSelect"><option value="">Select chapter to edit</option></select><button id="refreshChapters" type="button">Refresh chapters</button>
<div class="grid"><div><label>Chapter slug</label><input id="cslug" placeholder="kingdom-raw-887"></div><div><label>Manga slug</label><input id="mangaSlug" placeholder="kingdom-raw"></div></div>
<div class="grid"><div><label>Chapter number</label><input id="number" type="number"></div><div><label>Chapter title</label><input id="chapterTitle"></div></div>
<label>Chapter images</label><input id="imageFiles" type="file" accept="image/*" multiple><button id="uploadImages" type="button">⬆️ Upload selected images</button>
<label>Uploaded page paths</label><textarea id="pages" placeholder='["/chapter-images/kingdom-raw/chapter-887/001.jpg"]'></textarea>
<button id="saveChapter" type="button">💾 Save / Update chapter</button><button id="deleteChapter" class="danger" type="button">🗑 Delete chapter</button>
</div>
</main>
<script>
const REPO="kindgommangaraw/kindgommangaraw.github.io";
const KEY="mangaatlas_github_token",OLD_KEY="mr_admin_token";
const $=id=>document.getElementById(id),token=$("token"),status=$("status"),loginStatus=$("loginStatus"),connect=$("connect"),saveToken=$("saveToken");
let mangas=[],chapters=[];
function setState(ok,text){loginStatus.className="state "+(ok?"good":"bad");loginStatus.textContent="● "+text}
function storedToken(){return sessionStorage.getItem(KEY)||localStorage.getItem(KEY)||sessionStorage.getItem(OLD_KEY)||localStorage.getItem(OLD_KEY)||token.value.trim()}
function auth(){const t=storedToken();if(!t)throw Error("GitHub is not connected.");return t}
async function request(path,opt={},timeout=30000){const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch("https://api.github.com/repos/"+REPO+"/contents/"+path,{...opt,signal:ctl.signal,headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+auth(),"X-GitHub-Api-Version":"2022-11-28",...(opt.body?{"Content-Type":"application/json"}:{}),...(opt.headers||{})},cache:"no-store"});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error("GitHub HTTP "+r.status+": "+(d.message||"Request failed"));return d}catch(e){if(e.name==="AbortError")throw Error("GitHub request timed out.");throw e}finally{clearTimeout(tm)}}
async function verify(t){t=(t||"").trim();if(!t){setState(false,"Not connected");status.textContent="❌ Enter your GitHub token.";return}connect.disabled=true;status.textContent="Checking GitHub token...";try{const r=await fetch("https://api.github.com/repos/"+REPO,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+t,"X-GitHub-Api-Version":"2022-11-28"},cache:"no-store"});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.message||("HTTP "+r.status));sessionStorage.setItem(KEY,t);if(saveToken.checked)localStorage.setItem(KEY,t);else localStorage.removeItem(KEY);sessionStorage.removeItem(OLD_KEY);localStorage.removeItem(OLD_KEY);token.value="";setState(true,"Connected");status.textContent="✓ GitHub connected. Loading data...";await loadMangas();await loadChapters();status.textContent="✓ GitHub connected. Admin ready."}catch(e){setState(false,"Not connected");status.textContent="❌ Connection failed: "+e.message}finally{connect.disabled=false}}
connect.onclick=()=>verify(token.value);
$("clear").onclick=()=>{sessionStorage.removeItem(KEY);localStorage.removeItem(KEY);sessionStorage.removeItem(OLD_KEY);localStorage.removeItem(OLD_KEY);token.value="";saveToken.checked=false;setState(false,"Not connected");status.textContent="Token cleared."};
async function getJson(path){const d=await request(path+"?ref=main",{},20000);return JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,"")))))}
async function encodeText(s){return btoa(unescape(encodeURIComponent(s)))}
async function saveJson(path,obj,message){for(let i=0;i<3;i++){const d=await request(path+"?ref=main",{},20000);try{return await request(path,{method:"PUT",body:JSON.stringify({message,content:await encodeText(JSON.stringify(obj,null,2)+"\n"),branch:"main",sha:d.sha})},30000)}catch(e){if(!/409|422/.test(e.message)||i===2)throw e}}}
async function fileSha(path){try{return(await request(path+"?ref=main",{},15000)).sha}catch(e){if(e.message.includes("404"))return null;throw e}}
async function fileBase64(file){const bytes=new Uint8Array(await file.arrayBuffer());let s="";for(let i=0;i<bytes.length;i+=32768)s+=String.fromCharCode(...bytes.subarray(i,i+32768));return btoa(s)}
async function putFile(path,content,message){for(let i=0;i<3;i++){let sha=await fileSha(path),body={message,content,branch:"main"};if(sha)body.sha=sha;try{return await request(path,{method:"PUT",body:JSON.stringify(body)},90000)}catch(e){if(!/409|422/.test(e.message)||i===2)throw e}}}
function clearManga(){["slug","title","japaneseTitle","author","artist","genres","description","cover"].forEach(x=>$(x).value="");$("country").value="JP";$("mangaStatus").value="Ongoing";$("coverFile").value="";$("coverPreview").hidden=true;$("mangaSelect").value=""}
function fillManga(m){$("slug").value=m.slug||"";$("title").value=m.title||"";$("japaneseTitle").value=m.japanese_title||m.japaneseTitle||"";$("country").value=m.country||"JP";$("author").value=m.author||"";$("artist").value=m.artist||"";$("mangaStatus").value=m.status||"Ongoing";$("genres").value=Array.isArray(m.genres)?m.genres.join(", "):m.genres||"";$("description").value=m.description||"";$("cover").value=m.cover||"";$("coverPreview").hidden=!m.cover;if(m.cover)$("coverPreview").src=m.cover+"?v="+Date.now()}
async function loadMangas(){const d=await getJson("data/manga.json");mangas=d.manga||[];const s=$("mangaSelect");s.innerHTML='<option value="">➕ Add new manga</option>';mangas.forEach(m=>{const o=document.createElement("option");o.value=m.slug;o.textContent=m.title||m.slug;s.appendChild(o)})}
$("mangaSelect").onchange=()=>{const m=mangas.find(x=>x.slug===$("mangaSelect").value);m?fillManga(m):clearManga()};$("newManga").onclick=clearManga;
$("coverFile").onchange=()=>{const f=$("coverFile").files[0];if(f){$("coverPreview").src=URL.createObjectURL(f);$("coverPreview").hidden=false}};
async function saveManga(){const b=$("saveManga");try{let slug=$("slug").value.trim(),title=$("title").value.trim();if(!slug)slug=title.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");if(!slug||!title)throw Error("Slug and title are required.");if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug))throw Error("Slug must use lowercase letters, numbers and hyphens only.");b.disabled=true;b.textContent="⏳ Saving...";let cover=$("cover").value.trim(),f=$("coverFile").files[0];if(f){if(f.size>10*1024*1024)throw Error("Cover image is larger than 10 MB.");const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",p="manga-covers/"+slug+"."+ext;status.textContent="Uploading cover...";await putFile(p,await fileBase64(f),"Admin: upload manga cover");cover="/"+p}const item={slug,title,japanese_title:$("japaneseTitle").value.trim(),country:$("country").value.trim()||"JP",author:$("author").value.trim(),artist:$("artist").value.trim(),status:$("mangaStatus").value,genres:$("genres").value.split(",").map(x=>x.trim()).filter(Boolean),cover,description:$("description").value.trim()};const latest=await getJson("data/manga.json"),arr=latest.manga||[],old=$("mangaSelect").value,idx=arr.findIndex(x=>x.slug===old),dup=arr.findIndex(x=>x.slug===slug);if(idx>=0){if(dup>=0&&dup!==idx)throw Error("That slug already belongs to another manga.");arr[idx]=item}else{if(dup>=0)throw Error("A manga with this slug already exists.");arr.push(item)}latest.manga=arr;await saveJson("data/manga.json",latest,"Admin: save manga");await loadMangas();$("mangaSelect").value=slug;fillManga(item);status.textContent="✓ Manga saved: "+title}catch(e){status.textContent="❌ MANGA ERROR: "+e.message}finally{b.disabled=false;b.textContent="💾 Save manga"}}
$("saveManga").onclick=saveManga;
async function deleteManga(){const slug=$("mangaSelect").value;if(!slug)return alert("Select a manga first.");const m=mangas.find(x=>x.slug===slug);if(!confirm("Delete '"+(m?.title||slug)+"'? Chapters and images will NOT be deleted."))return;try{const d=await getJson("data/manga.json");d.manga=(d.manga||[]).filter(x=>x.slug!==slug);await saveJson("data/manga.json",d,"Admin: delete manga record");clearManga();await loadMangas();status.textContent="✓ Manga record deleted. Chapters/images kept."}catch(e){status.textContent="❌ DELETE ERROR: "+e.message}}
$("deleteManga").onclick=deleteManga;
function fillChapter(c){$("cslug").value=c.slug||"";$("mangaSlug").value=c.manga_slug||"";$("number").value=c.number||"";$("chapterTitle").value=c.title||"";$("pages").value=JSON.stringify(c.pages||[],null,2)}
async function loadChapters(){const d=await getJson("data/chapters.json");chapters=d.chapters||[];const s=$("chapterSelect");s.innerHTML='<option value="">Select chapter to edit</option>';chapters.forEach(c=>{const o=document.createElement("option");o.value=c.slug;o.textContent=(c.manga_slug||"Manga")+" — "+(c.title||("Chapter "+c.number));s.appendChild(o)});if(chapters[0]){s.value=chapters[0].slug;fillChapter(chapters[0])}}
$("chapterSelect").onchange=()=>{const c=chapters.find(x=>x.slug===$("chapterSelect").value);if(c)fillChapter(c)};$("refreshChapters").onclick=loadChapters;
async function uploadImages(){const files=[...$("imageFiles").files],m=$("mangaSlug").value.trim(),n=$("number").value.trim(),b=$("uploadImages");if(!m||!n||!files.length)return alert("Select manga, chapter number and images first.");b.disabled=true;try{const dir="chapter-images/"+m+"/chapter-"+n+"/",existing=await request(dir+"?ref=main",{},15000).catch(e=>e.message.includes("404")?[]:Promise.reject(e)),used=new Set((Array.isArray(existing)?existing:[]).map(x=>x.name)),nums=new Set([...used].map(x=>{const q=x.match(/^(\d+)\./);return q?Number(q[1]):0}));files.sort((a,z)=>a.name.localeCompare(z.name,undefined,{numeric:true}));const pages=[];for(const f of files){let i=1;while(nums.has(i))i++;nums.add(i);const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg",name=String(i).padStart(3,"0")+"."+ext;status.textContent="Uploading "+name+"...";await putFile(dir+name,await fileBase64(f),"Admin: upload chapter image");pages.push("/"+dir+name)}const all=(Array.isArray(existing)?existing:[]).filter(x=>/^\d+\.(jpg|jpeg|png|webp|gif)$/i.test(x.name)).map(x=>"/"+dir+x.name).concat(pages).sort((a,z)=>a.localeCompare(z,undefined,{numeric:true}));$("pages").value=JSON.stringify(all,null,2);status.textContent="✓ Uploaded. Save / Update chapter now."}catch(e){status.textContent="❌ UPLOAD ERROR: "+e.message}finally{b.disabled=false}}
$("uploadImages").onclick=uploadImages;
async function saveChapter(){try{const slug=$("cslug").value.trim(),m=$("mangaSlug").value.trim();if(!slug||!m)throw Error("Chapter slug and manga slug are required.");let pages=JSON.parse($("pages").value||"[]");const d=await getJson("data/chapters.json"),arr=d.chapters||[],item={id:slug,manga_slug:m,title:$("chapterTitle").value.trim(),number:Number($("number").value),slug,country:"JP",pages};const i=arr.findIndex(x=>x.slug===slug);if(i>=0)arr[i]=item;else arr.push(item);d.chapters=arr;await saveJson("data/chapters.json",d,"Admin: save chapter");await loadChapters();status.textContent="✓ Chapter saved."}catch(e){status.textContent="❌ CHAPTER ERROR: "+e.message}}
$("saveChapter").onclick=saveChapter;
async function deleteChapter(){const slug=$("chapterSelect").value;if(!slug)return alert("Select a chapter first.");if(!confirm("Delete this chapter record? Images will remain in GitHub."))return;try{const d=await getJson("data/chapters.json");d.chapters=(d.chapters||[]).filter(x=>x.slug!==slug);await saveJson("data/chapters.json",d,"Admin: delete chapter");await loadChapters();status.textContent="✓ Chapter deleted. Images kept."}catch(e){status.textContent="❌ DELETE ERROR: "+e.message}}
$("deleteChapter").onclick=deleteChapter;
const saved=storedToken();if(saved){saveToken.checked=!!localStorage.getItem(KEY)||!!localStorage.getItem(OLD_KEY);verify(saved)}
</script>
</body></html>
